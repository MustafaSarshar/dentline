[versions]
kotlin = "2.4.20"
spring-boot = "3.5.16"
# springdoc 3.x targets Spring Boot 4; the 2.9.x line is built against Boot 3.5.
springdoc = "2.9.1"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }

[libraries]
# Versions of everything below are managed by the Spring Boot BOM (see build.gradle.kts).
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-kafka = { module = "org.testcontainers:kafka" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

[bundles]
spring-web = ["spring-boot-starter-web", "spring-boot-starter-validation", "jackson-module-kotlin", "kotlin-reflect"]
persistence = ["spring-boot-starter-data-jpa", "flyway-core", "flyway-postgresql", "postgresql"]
observability = ["spring-boot-starter-actuator", "micrometer-prometheus"]
testcontainers = ["testcontainers-junit", "testcontainers-postgresql", "testcontainers-kafka", "spring-boot-testcontainers"]
